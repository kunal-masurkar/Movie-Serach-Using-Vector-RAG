name: CineVector CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Check Python syntax
      # --------------------------------------------------

      - name: Compile Python files
        run: |
          python -m compileall .

      # --------------------------------------------------
      # Run tests
      # --------------------------------------------------

      - name: Run pytest
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m pytest -v

      # --------------------------------------------------
      # Test CLI
      # --------------------------------------------------

      - name: Test CLI help
        run: |
          python main.py --help